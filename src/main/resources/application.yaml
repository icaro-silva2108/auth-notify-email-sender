spring:
  application:
    name: email_sender

  rabbitmq:
    addresses: ${CLOUD_AMQP_URL}
    username: ${CLOUD_AMQP_USERNAME}
    password: ${CLOUD_AMQP_PASSWORD}
    virtual-host: ${CLOUD_AMQP_VIRTUAL_HOST}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_GMAIL_USERNAME}
    password: ${SMTP_GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true
            required: true

server:
  port: 8081